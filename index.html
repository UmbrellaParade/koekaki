<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: スマホのキーボードが出たときに
         レイアウトを縮めて、入力欄がキーボードの下に隠れないようにする。
         拡大禁止は入れない（アクセシビリティのため。iOS の入力時ズームは CSS 側で防いでいる）。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="こえかき — 話すだけで、整った文章に。言い淀みや言い直しをAIが取り除き、そのまま使える文章にして出力する音声入力ツール。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="こえかき" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>こえかき — 話すだけで、整った文章に</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
