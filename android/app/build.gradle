plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.umbrellaparade.koekaki'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.umbrellaparade.koekaki'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkDependencies true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
